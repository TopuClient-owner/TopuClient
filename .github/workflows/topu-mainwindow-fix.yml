name: Topu MainWindow Source Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[topu-auto-fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix MainWindow.xaml.cs and remove temporary helpers
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('MainWindow.xaml.cs')
          text = path.read_text(encoding='utf-8')

          # JEGameAccount is provided by XboxAuthNet.Game in CmlLib.Core.Auth.Microsoft.
          if 'using XboxAuthNet.Game;' not in text:
              text = text.replace(
                  'using CmlLib.Core.ProcessBuilder;\n',
                  'using CmlLib.Core.ProcessBuilder;\nusing XboxAuthNet.Game;\n',
                  1)

          # ProfileNameInput was removed from the modern XAML. The active profile is now
          # represented by ProfileSelector, so keep profile state entirely in MainWindow.xaml.cs.
          text = re.sub(
              r'\n\s*if \(ProfileNameInput != null\)\n\s*\{\n\s*ProfileNameInput\.Text =\n\s*rememberedProfile;\n\s*\}\n',
              '\n',
              text,
              count=1)

          text = re.sub(
              r'\n\s*ProfileNameInput\.Text =\n\s*GetDisplayProfileName\(normalized\);\n',
              '\n',
              text,
              count=1)

          text = re.sub(
              r'    private string GetActiveProfileName\(\)\n    \{.*?\n    \}\n\n    // ============================================================\n    // PROFILE SELECTOR',
              '''    private string GetActiveProfileName()\n    {\n        if (ProfileSelector?.SelectedItem != null)\n        {\n            string selected = ProfileSelector.SelectedItem.ToString() ?? string.Empty;\n            if (!string.IsNullOrWhiteSpace(selected))\n                return selected.Trim();\n        }\n\n        string remembered = LoadRememberedProfile();\n        string display = GetDisplayProfileName(Path.GetFileName(remembered));\n        return string.IsNullOrWhiteSpace(display) ? DefaultProfileName : display;\n    }\n\n    // ============================================================\n    // PROFILE SELECTOR''',
              text,
              count=1,
              flags=re.S)

          text = re.sub(
              r'\n\s*ProfileNameInput\.Text =\n\s*GetDisplayProfileName\(\n\s*Path\.GetFileName\(gamePath\)\);\n',
              '\n',
              text,
              count=1)

          # JEGameAccount is a nullable value type in this API. Unwrap it before passing it
          # to Authenticate/Signout so the compiler cannot select the CancellationToken overload.
          text = text.replace(
              'await _loginHandler.Signout(\n                        account);',
              'await _loginHandler.Signout(\n                        account.Value);')

          text = text.replace(
              'await _loginHandler.Authenticate(\n                account);',
              'await _loginHandler.Authenticate(\n                account.Value);')

          # AuthTypeBox is not part of the modern Accounts UI. Keep the handler for backwards
          # compatibility with any old XAML event hookup, but do not reference a missing control.
          text = re.sub(
              r'    private void AuthTypeBox_SelectionChanged\(\n        object sender,\n        SelectionChangedEventArgs e\)\n    \{.*?\n    \}\n\n    // ============================================================\n    // SERVER',
              '''    private void AuthTypeBox_SelectionChanged(\n        object sender,\n        SelectionChangedEventArgs e)\n    {\n        if (StatusText != null)\n            StatusText.Text = "Use the Accounts tab to select your account.";\n    }\n\n    // ============================================================\n    // SERVER''',
              text,
              count=1,
              flags=re.S)

          path.write_text(text, encoding='utf-8', newline='\n')

          # The user explicitly requested that all launcher fixes live in MainWindow.xaml.cs.
          for helper in [
              'GlobalUsings.cs',
              'MainWindow.LegacyControls.cs',
              'BuildFix.cs',
              'CmlLibCompatibilityExtensions.cs',
          ]:
              p = Path(helper)
              if p.exists():
                  p.unlink()

          # Fail the workflow if any old compile-only references remain.
          final = path.read_text(encoding='utf-8')
          forbidden = ['ProfileNameInput', 'AuthTypeBox.SelectedIndex']
          for token in forbidden:
              if token in final:
                  raise SystemExit(f'Remaining forbidden reference: {token}')

          subprocess.run(['git', 'diff', '--check'], check=True)

      - name: Commit fixed MainWindow only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml.cs
          git add -u GlobalUsings.cs MainWindow.LegacyControls.cs BuildFix.cs CmlLibCompatibilityExtensions.cs || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix MainWindow CmlLib and profile references [topu-auto-fix]"
          git push

      - name: Remove temporary fixer workflow
        if: success()
        run: |
          git rm .github/workflows/topu-mainwindow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary MainWindow fixer [topu-auto-fix]"
          git push
