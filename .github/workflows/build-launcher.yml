name: Build Topu Client Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore TopuLauncher.csproj

      # Keep the application as a normal multi-file self-contained app.
      # TopuLauncher.exe is the installed application, NOT the installer.
      - name: Publish Launcher Application
        run: dotnet publish TopuLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o ./publish

      - name: Verify Published Application
        shell: pwsh
        run: |
          if (!(Test-Path './publish/TopuLauncher.exe')) { throw 'TopuLauncher.exe was not produced.' }
          Write-Host 'Published application files:'
          Get-ChildItem './publish' -Recurse | Select-Object FullName, Length

      # Inno Setup creates a separate Setup.exe which installs the complete
      # publish folder. The installed application remains multi-file.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.0 --no-progress -y

      - name: Create Installer Script
        shell: pwsh
        run: |
          @'
          #define MyAppName "Topu Client"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "BetterToppi"
          #define MyAppExeName "TopuLauncher.exe"

          [Setup]
          AppId={{8D2B2C7B-9B8D-4F5C-A4F1-4F1F4B7D8C31}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Topu Client
          DefaultGroupName=Topu Client
          OutputDir=installer
          OutputBaseFilename=TopuClient-Setup
          Compression=lzma2/max
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          PrivilegesRequired=admin
          UninstallDisplayName=Topu Client
          DisableProgramGroupPage=yes
          WizardStyle=modern

          [Files]
          Source: "publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Topu Client\Topu Client"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\Topu Client"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch Topu Client"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path TopuClient.iss -Encoding UTF8

      - name: Build Setup EXE
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' TopuClient.iss
          if (!(Test-Path './installer/TopuClient-Setup.exe')) { throw 'Setup EXE was not produced.' }
          Write-Host "Setup size: $((Get-Item './installer/TopuClient-Setup.exe').Length) bytes"

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: TopuClient-Setup
          path: ./installer/TopuClient-Setup.exe

      - name: Create Release and Attach Setup EXE
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./installer/TopuClient-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
