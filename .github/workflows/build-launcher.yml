name: Build Topu Client

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore TopuLauncher.csproj

      # Keep the application as a normal multi-file self-contained app.
      # The installer is a separate executable.
      - name: Publish Launcher Application
        run: dotnet publish TopuLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o ./publish

      - name: Verify Published Application
        shell: pwsh
        run: |
          if (!(Test-Path './publish/TopuLauncher.exe')) { throw 'TopuLauncher.exe was not produced.' }
          Write-Host 'Published application files:'
          Get-ChildItem './publish' -Recurse | Select-Object FullName, Length

      # GitHub-hosted Windows runners currently provide the newer Inno Setup package.
      # Use the installed/current version instead of forcing the older 6.7.0 package.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y

      - name: Create Inno Setup Installer Definition
        shell: pwsh
        run: |
          @'
          #define MyAppName "Topu Client"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "BetterToppi"
          #define MyAppExeName "TopuLauncher.exe"

          [Setup]
          AppId={{8D2B2C7B-9B8D-4F5C-A4F1-4F1F4B7D8C31}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Topu Client
          DefaultGroupName=Topu Client
          UninstallDisplayIcon={app}\{#MyAppExeName}
          OutputDir=.
          OutputBaseFilename=TopuClient-Setup
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          LicenseFile=LICENSE
          Uninstallable=yes

          [Files]
          Source: "publish\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{autoprograms}\Topu Client"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\Topu Client"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch Topu Client"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path TopuClient.iss -Encoding UTF8

      - name: Build Topu Client Installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          & $iscc.FullName 'TopuClient.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Installer
        shell: pwsh
        run: |
          if (!(Test-Path './TopuClient-Setup.exe')) { throw 'TopuClient-Setup.exe was not produced.' }
          Write-Host "Installer size: $((Get-Item './TopuClient-Setup.exe').Length) bytes"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopuClient-Setup
          path: ./TopuClient-Setup.exe

      - name: Create Release and Attach Installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./TopuClient-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
