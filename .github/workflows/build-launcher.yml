name: Build Topu Client MSI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore TopuLauncher.csproj

      - name: Publish Launcher Application
        run: dotnet publish TopuLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o ./publish

      - name: Verify Published Application
        shell: pwsh
        run: |
          if (!(Test-Path './publish/TopuLauncher.exe')) { throw 'TopuLauncher.exe was not produced.' }
          Write-Host 'Published application files:'
          Get-ChildItem './publish' -Recurse | Select-Object FullName, Length

      - name: Install WiX Toolset 6.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.UI.wixext/6.0.2

      - name: Create MSI Installer Definition
        shell: pwsh
        run: |
          @'
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs"
               xmlns:ui="http://wixtoolset.org/schemas/v4/wxs/ui">
            <Package
              Name="Topu Client"
              Manufacturer="BetterToppi"
              Version="1.0.0.0"
              UpgradeCode="8D2B2C7B-9B8D-4F5C-A4F1-4F1F4B7D8C31"
              Scope="perMachine">

              <MajorUpgrade DowngradeErrorMessage="A newer version of Topu Client is already installed." />
              <MediaTemplate EmbedCab="yes" />

              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="Topu Client" />
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="TopuStartMenuFolder" Name="Topu Client">
                  <Component Id="StartMenuComponent" Guid="*">
                    <Shortcut
                      Id="TopuStartMenuShortcut"
                      Name="Topu Client"
                      Description="Launch Topu Client"
                      Target="[INSTALLFOLDER]TopuLauncher.exe"
                      WorkingDirectory="INSTALLFOLDER" />
                    <RemoveFolder Id="RemoveTopuStartMenuFolder" On="uninstall" />
                    <RegistryValue
                      Root="HKCU"
                      Key="Software\BetterToppi\TopuClient"
                      Name="Installed"
                      Type="integer"
                      Value="1"
                      KeyPath="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>

              <Feature Id="MainFeature" Title="Topu Client" Level="1">
                <Files Include="!(bindpath.publish)\**" Directory="INSTALLFOLDER" />
                <ComponentRef Id="StartMenuComponent" />
              </Feature>

              <ui:WixUI Id="WixUI_InstallDir" InstallDirectory="INSTALLFOLDER" />
            </Package>
          </Wix>
          '@ | Set-Content -Path TopuClient.wxs -Encoding UTF8

      - name: Build MSI Installer
        run: wix build TopuClient.wxs -arch x64 -bindpath publish=publish -o ./TopuClient-Setup.msi -ext WixToolset.UI.wixext

      - name: Verify MSI
        shell: pwsh
        run: |
          if (!(Test-Path './TopuClient-Setup.msi')) { throw 'MSI was not produced.' }
          Write-Host "MSI size: $((Get-Item './TopuClient-Setup.msi').Length) bytes"

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopuClient-MSI
          path: ./TopuClient-Setup.msi

      - name: Create Release and Attach MSI
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./TopuClient-Setup.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
