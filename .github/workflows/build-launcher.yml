name: Build Topu Launcher EXE

on:
  push:
    branches:
      - main
      
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore TopuLauncher.csproj

    - name: Fix Microsoft Account API Compatibility
      shell: pwsh
      run: |
        $path = 'MainWindow.xaml.cs'
        $text = [System.IO.File]::ReadAllText($path)

        # CmlLib.Core.Auth.Microsoft 3.3.1 exposes the Minecraft profile
        # through JEGameAccount.Profile, while IXboxGameAccount itself does
        # not expose Gamertag or XboxTokens. Use reflection here so the
        # existing MainWindow.xaml.cs remains otherwise untouched.
        $old1 = 'string username =`n                            account.XboxTokens?.XstsToken?.XuiClaims?.Gamertag`n                            ?? "Microsoft Account";'
        $new1 = 'string username = "Microsoft Account";`n                        try`n                        {`n                            var profileProperty = account.GetType().GetProperty("Profile");`n                            var profile = profileProperty?.GetValue(account);`n                            var usernameProperty = profile?.GetType().GetProperty("Username");`n                            var profileUsername = usernameProperty?.GetValue(profile)?.ToString();`n                            if (!string.IsNullOrWhiteSpace(profileUsername))`n                                username = profileUsername;`n                        }`n                        catch`n                        {`n                            // Keep the safe fallback name if profile information is unavailable.`n                        }'

        if ($text.Contains($old1)) {
          $text = $text.Replace($old1, $new1)
        }
        elseif ($text.Contains('account.XboxTokens?.XstsToken?.XuiClaims?.Gamertag')) {
          $text = $text.Replace('string username =`n                            account.XboxTokens?.XstsToken?.XuiClaims?.Gamertag`n                            ?? "Microsoft Account";', $new1)
        }
        elseif ($text.Contains('account.Gamertag')) {
          $text = $text.Replace('account.Gamertag', '"Microsoft Account"')
        }

        [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add MainWindow.xaml.cs
        git diff --cached --quiet
        if ($LASTEXITCODE -ne 0) {
          git commit -m 'Fix Microsoft account profile username API'
          git push
        }

    - name: Publish Standalone Single-File EXE
      run: |
        dotnet publish TopuLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Upload Launcher Executable
      uses: actions/upload-artifact@v4
      with:
        name: TopuLauncher-Win64
        path: ./publish/TopuLauncher.exe

    - name: Create Release and Attach EXE
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/TopuLauncher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
