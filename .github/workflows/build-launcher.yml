name: Build Topu Launcher EXE

on:
  push:
    branches:
      - main
      
    tags:
      - 'v*' # Builds and publishes a GitHub Release when you push tags like v1.0.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Step 1: Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up .NET 8 SDK
    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Step 3: Restore NuGet dependencies
    - name: Restore NuGet Packages
      run: dotnet restore TopuLauncher.csproj

    # Temporary source patch: IXboxGameAccount exposes Identifier, while the installed 3.3.1 API does not expose Gamertag/XboxTokens.
    - name: Fix Microsoft Account Display API
      shell: pwsh
      run: |
        $path = 'MainWindow.xaml.cs'
        $text = [System.IO.File]::ReadAllText($path)
        $text = $text.Replace('account.XboxTokens?.XstsToken?.XuiClaims?.Gamertag', 'account.Identifier')
        [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add MainWindow.xaml.cs
        if (-not (git diff --cached --quiet)) {
          git commit -m 'Fix Microsoft account display API in MainWindow'
          git push
        }

    # Step 5: Build and Publish single-file EXE
    - name: Publish Standalone Single-File EXE
      run: |
        dotnet publish TopuLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    # Step 6: Upload build artifact so you can download the EXE directly from GitHub Actions
    - name: Upload Launcher Executable
      uses: actions/upload-artifact@v4
      with:
        name: TopuLauncher-Win64
        path: ./publish/TopuLauncher.exe

    # Step 7: Create GitHub Release if a tag is pushed
    - name: Create Release and Attach EXE
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/TopuLauncher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
