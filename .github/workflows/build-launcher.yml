name: Build Topu Launcher EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore TopuLauncher.csproj

    - name: Fix Microsoft Account API In MainWindow.xaml.cs
      shell: pwsh
      run: |
        $path = 'MainWindow.xaml.cs'
        $text = [System.IO.File]::ReadAllText($path)

        # CmlLib.Core.Auth.Microsoft 3.3.1: IXboxGameAccount does not expose
        # Gamertag or XboxTokens. JEGameAccount exposes Profile.Username.
        # Replace the invalid username block without adding compatibility files.
        $pattern = '(?s)string username\s*=\s*account\.XboxTokens\?\.XstsToken\?\.XuiClaims\?\.Gamertag\s*\?\?\s*"Microsoft Account";'
        $replacement = @'
string username = "Microsoft Account";
                        if (account is JEGameAccount jeAccount)
                        {
                            username = jeAccount.Profile?.Username
                                ?? "Microsoft Account";
                        }
'@

        $updated = [regex]::Replace($text, $pattern, $replacement, 1)

        if ($updated -eq $text) {
          Write-Host 'The invalid XboxTokens username expression was not found.'
          Write-Host 'Checking for any remaining direct Gamertag/XboxTokens references...'
          $updated = $text -replace 'account\.Gamertag', '"Microsoft Account"'
          $updated = $updated -replace 'account\.XboxTokens\?\.XstsToken\?\.XuiClaims\?\.Gamertag', '"Microsoft Account"'
        }

        [System.IO.File]::WriteAllText($path, $updated, [System.Text.UTF8Encoding]::new($false))

        Write-Host 'Relevant Microsoft account code after patch:'
        Select-String -Path $path -Pattern 'string username|JEGameAccount|XboxTokens|Gamertag' -Context 1,2

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add MainWindow.xaml.cs
        if (-not (git diff --cached --quiet)) {
          git commit -m 'Fix Microsoft account username API in MainWindow'
          git push
        }

    - name: Publish Standalone Single-File EXE
      run: |
        dotnet publish TopuLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Upload Launcher Executable
      uses: actions/upload-artifact@v4
      with:
        name: TopuLauncher-Win64
        path: ./publish/TopuLauncher.exe

    - name: Create Release and Attach EXE
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/TopuLauncher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
