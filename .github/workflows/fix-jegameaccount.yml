name: Fix CmlLib account type

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix MainWindow.xaml.cs
        shell: python
        run: |
          from pathlib import Path

          path = Path("MainWindow.xaml.cs")
          text = path.read_text(encoding="utf-8")

          if "using XboxAuthNet.Game.Accounts;" not in text:
              text = text.replace(
                  "using XboxAuthNet.Game;",
                  "using XboxAuthNet.Game;\nusing XboxAuthNet.Game.Accounts;",
                  1,
              )

          text = text.replace("JEGameAccount", "IXboxGameAccount")
          text = text.replace(
              "account.Profile?.Username\n                            ?? \"Microsoft Account\"",
              "account.Gamertag\n                            ?? \"Microsoft Account\"",
          )
          text = text.replace("account.Value", "account")

          path.write_text(text, encoding="utf-8")

      - name: Commit fixed MainWindow.xaml.cs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml.cs
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Fix Microsoft account type in MainWindow"
          git push
